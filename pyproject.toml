[project]
name = "shopsense"
version = "0.1.0"
description = "Retail customer analytics project using the UCI Online Retail dataset"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1,<4.0",
    "matplotlib>=3.8,<4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
