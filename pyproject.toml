
[project]
name = "shopsense"
version = "0.1.0"
description = "Retail customer analytics project using the UCI Online Retail dataset"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1,<4.0",
    "matplotlib>=3.8,<4.0",
    "scikit-learn>=1.5,<2.0",
    "joblib>=1.3,<2.0",
    "streamlit>=1.40,<2.0",
    "plotly>=5.24,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "notebook>=7.0,<8.0",
    "ipykernel>=6.29,<7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
